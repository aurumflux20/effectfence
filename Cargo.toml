[package]
name = "core-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.1.0", features = ["transport-io", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
