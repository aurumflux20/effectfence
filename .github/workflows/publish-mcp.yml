name: Publish to MCP Registry

# NOT triggered by the tag push. The registry validates that every package it
# lists actually EXISTS at the stated version -- and on a tag push, npm and
# crates.io have not been published yet, so it fails with a 404 on our own
# package. Ordering matters: publish the packages first, then register them.
#
# Run this by hand (or let the npm publish workflow finish) once
# `npm view effectfence@X` and `cargo search effectfence` both show the version.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — no secrets, no manual login
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server to the MCP Registry
        run: ./mcp-publisher publish
